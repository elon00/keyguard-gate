name: Fail-closed build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python tests (reject corrupt sources)
        run: python -m compileall -q tests
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run all Python tests (no fake pass output)
        run: python -m pytest -q tests -o python_files='*.py'
      - name: Check Rust source (no network dependencies)
        run: cargo check --offline
      - name: Run Rust unit tests (no network dependencies)
        run: cargo test --offline
